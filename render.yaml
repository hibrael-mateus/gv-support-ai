# GV Support AI website on Render (free plan). Render → New → Blueprint → this repository.
# Values marked "sync: false" are asked for on screen and stay only in Render: never put them in this file.
services:
  - type: web
    name: gv-support-ai
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GV_WEB_PASSWORD # team password for the site
        sync: false
      - key: GV_SECRET_GEMINI_API_KEY # aistudio.google.com/apikey
        sync: false
      - key: GV_SECRET_GOOGLE_SERVICE_ACCOUNT # service account JSON with read access to the Drive folder
        sync: false
      - key: HF_TOKEN # optional: keeps cases and history in a private Hugging Face dataset across restarts
        sync: false
      - key: GV_CONFIG_LLM_PROVIDER
        value: gemini
      - key: GV_CONFIG_EMBEDDING_MODEL # lexical search only: saves the free Gemini quota for answers
        value: '""'
      - key: GV_CONFIG_INTERNET_ENABLED
        value: "true"
