[package]
name = "gv-support-ai"
version = "1.2.0"
description = "GV Support AI - investigação técnica assistida por IA para o suporte GV Dasa"
authors = ["GV Dasa Suporte"]
license = "Proprietary"
edition = "2021"

[lib]
name = "gv_support_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
