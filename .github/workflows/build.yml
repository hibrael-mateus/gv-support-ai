name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Backend tests (Drive restriction, RAG, citations, anti-hallucination, SQL, PowerShell, cases, update)
        working-directory: backend
        run: python -m pytest -q
      - name: Generated PowerShell scripts parse without errors
        shell: pwsh
        run: |
          python scripts/export_ps_samples.py ps-samples
          $failed = $false
          foreach ($f in Get-ChildItem ps-samples -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $failed = $true; Write-Host "::error file=$($f.Name)::$($errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" })" }
          }
          if ($failed) { exit 1 }
          # Windows PowerShell 5.1 (what analysts run) must parse them too.
          powershell -NoProfile -Command "foreach (`$f in Get-ChildItem ps-samples -Filter *.ps1) { `$e=`$null; [void][System.Management.Automation.Language.Parser]::ParseFile(`$f.FullName,[ref]`$null,[ref]`$e); if (`$e) { Write-Host `$f.Name `$e; exit 1 } }"

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: pip install -r backend/requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: desktop
      - run: python tests/ui_smoke.py ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: ui-screenshots }

  installer:
    needs: [backend-tests, ui-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Backend executable (PyInstaller onedir)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pyinstaller gv-support-backend.spec --noconfirm
      - name: Frozen backend answers /health
        shell: pwsh
        working-directory: backend/dist/gv-support-backend
        run: |
          $env:GV_PORT = "8799"; $env:GV_SUPPORT_DATA_DIR = "$env:RUNNER_TEMP\gvdata"
          $p = Start-Process .\gv-support-backend.exe -PassThru
          $ok = $false
          foreach ($i in 1..60) { try { Invoke-RestMethod http://127.0.0.1:8799/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          Stop-Process $p -Force
          if (-not $ok) { throw "backend executable did not start" }

      - name: Desktop app and installers (NSIS + MSI)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles nsis,msi

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          $v = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe)[0] "release/GVSupportAI-Setup.exe"
          Copy-Item (Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi)[0] "release/GVSupportAI.msi"
          Get-ChildItem release | Format-Table Name, Length

      - name: Silent install, launch and uninstall
        shell: pwsh
        run: |
          $setup = Start-Process release\GVSupportAI-Setup.exe -ArgumentList "/S" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "installer exit code $($setup.ExitCode)" }
          $dir = "$env:ProgramFiles\GV Support AI"
          $exe = Join-Path $dir "GV Support AI.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem $dir -Recurse | Select-Object -First 40 FullName; throw "app not installed in $dir" }
          if (-not (Test-Path (Join-Path $dir "backend\gv-support-backend.exe"))) { throw "backend not bundled" }
          $lnk = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "GV Support AI*.lnk"
          if (-not $lnk) { throw "Start Menu shortcut missing" }
          $app = Start-Process $exe -PassThru
          $backendUp = $false
          foreach ($i in 1..60) { if (Get-Process gv-support-backend -ErrorAction SilentlyContinue) { $backendUp = $true; break }; Start-Sleep 1 }
          Stop-Process $app -Force -ErrorAction SilentlyContinue
          if (-not $backendUp) { throw "app did not start its backend" }
          foreach ($i in 1..20) { if (-not (Get-Process gv-support-backend -ErrorAction SilentlyContinue)) { break }; Start-Sleep 1 }
          if (Get-Process gv-support-backend -ErrorAction SilentlyContinue) { throw "backend kept running after the app closed" }
          $un = Join-Path $dir "uninstall.exe"
          Start-Process $un -ArgumentList "/S" -Wait
          Start-Sleep 3
          if (Test-Path $exe) { throw "uninstaller left the app behind" }
          Write-Host "Install / launch / uninstall OK"

      - uses: actions/upload-artifact@v4
        with: { name: GVSupportAI-windows, path: release/* }

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
